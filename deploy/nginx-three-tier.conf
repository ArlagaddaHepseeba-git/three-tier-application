# ==============================================================
# FINAL Nginx config: Frontend HTTPS, Backend HTTPS + HTTP (both via Nginx)
#
#   https://your-domain/        -> React build           (FRONTEND HTTPS)
#   https://your-domain/api/*   -> backend :8080          (BACKEND HTTPS)
#   http://your-domain/api/*    -> backend :8080          (BACKEND HTTP)
#   http://your-domain/         -> 301 redirect to HTTPS  (frontend HTTPS only)
#
# The backend stays on plain HTTP :8080 internally; Nginx does ALL TLS
# using the certbot cert. Replace app.yoursite.com below (the setup script
# does this automatically via sed).
# ==============================================================

# ---- HTTPS server: frontend + backend over TLS ----------------
server {
    listen 443 ssl http2;
    server_name app.yoursite.com;

    # certbot certonly place the cert here (see setup-ubuntu.sh /
    # deploy/README.md). The live/ symlinks auto-update on renewal.
    ssl_certificate     /etc/letsencrypt/live/app.yoursite.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.yoursite.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/html;
    index index.html;

    # ---- Backend API over HTTPS -------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # ---- React SPA --------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---- HTTP server: backend over HTTP only + frontend redirect ----
server {
    listen 80;
    server_name app.yoursite.com;

    # ---- Backend API over plain HTTP --------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # ---- Everything else goes to HTTPS (frontend is HTTPS-only) -
    location / {
        return 301 https://$host$request_uri;
    }
}