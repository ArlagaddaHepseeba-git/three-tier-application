# ==============================================================
# BOOTSTRAP config (used ONCE, BEFORE the cert exists).
# Serves the backend over HTTP /api and the frontend so that
#   certbot certonly --nginx -d app.yoursite.com
# can complete the HTTP-01 challenge. The final config
# (nginx-three-tier.conf) replaces this file afterwards.
# ==============================================================

server {
    listen 80;
    server_name app.yoursite.com;

    root /var/www/html;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}