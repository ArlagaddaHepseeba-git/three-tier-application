# =====================
# Server config - HTTPS (mkcert local certs)
# =====================
server.port=${PORT:8443}
server.ssl.enabled=true
server.ssl.key-store=classpath:ssl/localhost.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=devops-practice

# Additional HTTP connector (listens together with HTTPS)
http.port=${HTTP_PORT:8080}

# =====================
# Database connection (MySQL)
# Override these via environment variables when containerizing
# =====================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/devops_practice_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================
# JPA / Hibernate
# =====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =====================
# Actuator (health endpoint at /actuator/health)
# =====================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always