# =====================
# Production profile
# Enable with: SPRING_PROFILES_ACTIVE=production
# =====================
# TLS is terminated by Nginx (certbot), the backend stays on plain
# HTTP internally. With ssl.enabled=false the dev-only HttpHttpsConfig
# is skipped too, so the app has a single plain-HTTP connector.
server.ssl.enabled=false
server.port=${PORT:8080}

# MySQL on the server (change to match your own database):
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/devops_practice_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}