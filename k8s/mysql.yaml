apiVersion: v1
kind: Namespace
metadata:
  name: three-tier
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: three-tier
type: Opaque
data:
  MYSQL_ROOT_PASSWORD: cm9vdA==   # base64('root')
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-initdb
  namespace: three-tier
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS devops_practice_db;
    USE devops_practice_db;
    CREATE TABLE IF NOT EXISTS items (
      id BIGINT NOT NULL AUTO_INCREMENT PRIMARY KEY,
      name VARCHAR(255) NOT NULL,
      created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
    );
    INSERT INTO items (name) VALUES
      ('Learn Docker'),
      ('Setup Kubernetes'),
      ('Configure CI/CD'),
      ('Deploy to AWS'),
      ('Monitor with Prometheus'),
      ('Practice Terraform'),
      ('Write a GitHub Action');
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: three-tier
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: three-tier-mysql
  namespace: three-tier
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: devops_practice_db
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-data
        - name: initdb
          configMap:
            name: mysql-initdb
---
apiVersion: v1
kind: Service
metadata:
  name: three-tier-mysql
  namespace: three-tier
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306